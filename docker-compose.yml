version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: semantic_search_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Semantic Similarity Search
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - MODEL_PATH=models/word2vec.model
      - VECTOR_PATH=models/doc_vectors_w2v.npy
      - DATASET_PATH=models/cleaned_dataset.csv
      - CORS_ORIGINS=http://localhost,http://localhost:5173,http://localhost:80
    volumes:
      - ./backend/models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: semantic_search_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
