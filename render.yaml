services:
  # ---------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ---------------------------------------------------------
  - type: web
    name: semantic-similarity-search-system
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: "*"

  # ---------------------------------------------------------
  # 2. React Frontend Static Site
  # ---------------------------------------------------------
  - type: web
    name: semantic-search-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://semantic-similarity-search-system.onrender.com/api/v1
